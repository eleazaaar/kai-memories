spring.application.name=kai-memories

spring.config.import=optional:file:.env[.properties]

# Local development
server.port=${PORT}
spring.ai.openai.base-url=${OLLAMA_API_URL}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.api-key=${OLLAMA_API_KEY}
spring.ai.openai.chat.options.model=gpt-oss:20b-cloud

personal-ai.base-url=${BASE_URL}
personal-ai.environment=${ENVIRONMENT}

# MySQL / XAMPP
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - local development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB