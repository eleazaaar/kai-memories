 <!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Panel Login | Kai Caleb Memories</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f7f1e8;
            color: #493c34;
            font-family: Georgia, "Times New Roman", serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 42px 36px;
            background: #fffdf9;
            border: 1px solid #e8d8c7;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(73, 60, 52, 0.08);
            text-align: center;
        }

        .brand {
            margin-bottom: 8px;
            color: #a65d43;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0;
            font-size: 32px;
            font-weight: normal;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #827267;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        .alert {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        .error {
            background: #fbe9e5;
            color: #913e32;
        }

        .success {
            background: #eaf4e9;
            color: #35653a;
        }

        .field {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dfd2c5;
            border-radius: 8px;
            background: #fff;
            color: #493c34;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #c58a70;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #a65d43;
            color: #fff;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #85452f;
        }

        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #8b5b45;
            font-family: Arial, sans-serif;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
<main class="login-card">
    <div class="brand">Kai Caleb Memories</div>

    <h1>Family Panel</h1>

    <p class="subtitle">
        A private space to preserve your family's memories,
        stories, and special moments.
    </p>

    <div th:if="${param.error}" class="alert error">
        Invalid username or password. Please try again.
    </div>

    <div th:if="${param.logout}" class="alert success">
        You have successfully logged out.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
                autofocus>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required>
        </div>

        <button type="submit">Sign In</button>
    </form>

    <a class="back-link" th:href="@{/}">
        ← Back to the public landing page
    </a>
</main>
</body>
</html>
